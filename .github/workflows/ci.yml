name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: false
      - name: Validate generated adapters
        run: python3 scripts/generate_adapters.py --check
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate repository
        run: python3 scripts/validate_repo.py
      - name: Build release archive
        run: python3 scripts/build_release.py
