name: Feature request
description: Propose a role, workflow, verification gate, adapter, or automation improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What Godot production problem is difficult today?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Example workflow
      description: Show a concrete user request and the desired maker, reviewer, QA, and evidence behavior.
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Best fit
      options: [Community correctness loop, Pro automation, Harness adapter, Benchmark, Documentation, Unsure]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable result would prove this feature works?
